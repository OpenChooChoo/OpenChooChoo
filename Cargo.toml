[workspace]
resolver = "3"
members = [
    "crates/occ",
    "crates/occ-common",
    "crates/occ-components",
    "crates/occ-render-vk",
    "crates/occ-systems",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "Connor Fitzgerald <connorwadefitzgerald@gmail.com>",
    "Kane Rogers-Wong <kane.m.rogers@gmail.com>",
]
license = "MPL-2.0"

[workspace.dependencies]
anyhow = { version = "1", features = ["backtrace"] }
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.32", features = ["bytemuck", "debug-glam-assert"] }
gltf = { version = "1.4", default-features = false, features = ["utils"] }
hecs = "0.11"
ktx2 = "0.5"
log = "0.4"
raw-window-handle = { version = "0.6", features = ["std"] }
sdl3 = { version = "0.18.4", features = [
    "build-from-source-static",
    "raw-window-handle",
] }
thiserror = "2"
vk-mem = "0.5"

occ-common = { path = "crates/occ-common" }
occ-components = { path = "crates/occ-components" }
occ-render-vk = { path = "crates/occ-render-vk" }
occ-systems = { path = "crates/occ-systems" }
